{% extends "base.html"%}
{% load static%}


{% block title%}
Create Tour
{%endblock%}


{% block content%}
<div class="mx-auto max-w-5xl px-4 py-10 sm:px-6 lg:px-8">
    <div class="mb-8 max-w-2xl">
        <p class="text-xs font-bold uppercase tracking-[0.2em] text-brand-600">Build your itinerary</p>
        <h1 class="mt-3 font-display text-4xl font-extrabold tracking-tight text-slate-950">Create a new tour</h1>
        <p class="mt-3 text-slate-500">Set the essentials now. You can invite your group and track every shared cost once the tour is live.</p>
    </div>

    <div class="rounded-3xl border border-slate-200 bg-white p-5 shadow-soft sm:p-8">

    <div>
    <label
        for="image"
        class="block text-sm font-bold text-slate-700">
        Tour Image
    </label>

    <input
        type="file"
        id="image"
        name="image"
        onchange="previewImage(event)"
        accept=".jpg,.jpeg,.png,.webp"
               class="mt-2 block w-full rounded-xl border border-dashed border-brand-200 bg-brand-50/50 p-4 text-sm text-slate-700
               file:mr-4 file:rounded-lg file:border-0
               file:bg-brand-600 file:px-4 file:py-2
               file:text-sm file:font-semibold file:text-white
               hover:file:bg-brand-700">
            <div id="imagePreviewContainer" class="mt-4 hidden">
        <img
            id="imagePreview"
            src="#"
            alt="Tour Image Preview"
                class="max-h-56 w-full rounded-xl border border-slate-200 object-cover sm:w-80">
    </div>       
</div>

    <form id="tourform">
        <div class="mt-8 grid gap-5 md:grid-cols-2">
            <div>
                <label class="font-semibold">
                    Tour Title
                </label>
                <input
                    id="title"
                    type="text"
                    class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3 outline-none transition focus:border-brand-500 focus:ring-4 focus:ring-brand-100">
            </div>
            <div>
                 <label class="font-semibold">
                    Destination
                </label>
                <input
                 id="destination"
                 type="text"
                 class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3 outline-none transition focus:border-brand-500 focus:ring-4 focus:ring-brand-100">
            </div>
                <div>
                <label class="font-semibold">budget</label>
                <input 
                id="budget"
                type="number"
                class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3 outline-none transition focus:border-brand-500 focus:ring-4 focus:ring-brand-100">
            </div>
            <div>
                <label class="font-semibold">Status</label>
                <select
                    id="status"
                    class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3 outline-none transition focus:border-brand-500 focus:ring-4 focus:ring-brand-100">
                    <option value="planned">Planned</option>
                    <option value="ongoing">Ongoing</option>
                    <option value="completed">Completed</option>
                    <option value="cancelled">Cancelled</option>
                </select>
            </div>
                <div>
                <label class="font-semibold text-slate-700">Start Date</label>
                <input 
                    id="startDate"
                    type="date"
                    class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3 outline-none transition focus:border-brand-500 focus:ring-4 focus:ring-brand-100">
            </div>
            <div>
                <label class="font-semibold text-slate-700">End Date</label>
                <input id="endDate"
                type="date"
                class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3 outline-none transition focus:border-brand-500 focus:ring-4 focus:ring-brand-100">
            </div>
        </div>
        <div class="mt-6">
            <label class="font-semibold text-slate-700">Description</label>
            <textarea
                id="description"
                rows="5"
                class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3 outline-none transition focus:border-brand-500 focus:ring-4 focus:ring-brand-100"></textarea>
        </div>
        <div id="message" class="mt-6"></div>
        <button
            class="mt-8 w-full rounded-xl bg-brand-600 px-8 py-3.5 font-bold text-white shadow-soft transition hover:bg-brand-700 sm:w-auto">Save Tour</button>
    </form>
    
</div>
</div>
{%endblock%}
{% block scripts%}
<script src="{%static 'js/create-tour.js'%}"></script>
{% endblock %}
