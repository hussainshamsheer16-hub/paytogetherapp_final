{% extends "base.html" %}

{% block title %}Payment cancelled{% endblock %}

{% block content %}
<section class="mx-auto max-w-xl px-4 py-16 text-center sm:px-6 lg:py-24">
    <div class="rounded-3xl border border-amber-200 bg-white p-8 shadow-soft sm:p-10">
        <p class="mx-auto grid h-16 w-16 place-items-center rounded-full bg-amber-50 text-3xl font-bold text-amber-600">!</p>
        <h1 class="mt-4 text-2xl font-display font-extrabold text-slate-950">Payment cancelled</h1>
        <p class="mt-3 text-slate-600">Your payment was cancelled or not completed. Your settlement has not been marked as paid.</p>
        <div class="mt-8 flex justify-center gap-3">
            <a href="javascript:history.back()" class="rounded-xl border border-slate-300 px-5 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50">Try again</a>
            <a href="/dashboard/" class="rounded-xl bg-brand-600 px-5 py-3 text-sm font-bold text-white hover:bg-brand-700">Dashboard</a>
        </div>
    </div>
</section>
{% endblock %}
