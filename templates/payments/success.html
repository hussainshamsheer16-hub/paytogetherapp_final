{% extends "base.html" %}
{% load static %}

{% block title %}Payment status{% endblock %}

{% block content %}
<section class="mx-auto max-w-xl px-4 py-16 text-center sm:px-6 lg:py-24">
    <div id="paymentLoading" class="rounded-3xl border border-slate-200 bg-white p-10 shadow-soft">
        <p class="text-sm font-semibold text-slate-500">Verifying payment with PayTogether...</p>
    </div>
    <div id="paymentResult" class="hidden rounded-3xl border border-slate-200 bg-white p-8 shadow-soft sm:p-10">
        <p id="paymentIcon" class="mx-auto grid h-16 w-16 place-items-center rounded-full bg-emerald-50 text-3xl text-emerald-600">✓</p>
        <h1 id="paymentTitle" class="mt-4 text-2xl font-display font-extrabold text-slate-950">Payment status</h1>
        <p id="paymentMessage" class="mt-3 text-slate-600"></p>
        <dl class="mx-auto mt-6 max-w-sm space-y-3 text-left text-sm">
            <div class="flex justify-between gap-4"><dt class="text-slate-500">Amount</dt><dd id="paymentAmount" class="font-bold text-slate-900"></dd></div>
            <div class="flex justify-between gap-4"><dt class="text-slate-500">Status</dt><dd id="paymentStatus" class="font-bold uppercase text-slate-900"></dd></div>
            <div class="flex justify-between gap-4"><dt class="text-slate-500">Transaction</dt><dd id="paymentReference" class="max-w-[14rem] break-all text-right font-semibold text-slate-900"></dd></div>
        </dl>
        <a href="/dashboard/" class="mt-8 inline-flex rounded-xl bg-brand-600 px-5 py-3 text-sm font-bold text-white shadow-soft hover:bg-brand-700">Back to dashboard</a>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/stripe-payment.js' %}"></script>
{% endblock %}
